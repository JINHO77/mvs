  <!-- Cheeks -->
  <circle cx="33" cy="70" r="6.5" fill="#FCA5A5" opacity="0.35"/>
  <circle cx="67" cy="70" r="6.5" fill="#FCA5A5" opacity="0.35"/>
  <!-- Bamboo -->
