  <circle cx="28" cy="34" r="14" fill="#1E293B"/>
  <circle cx="72" cy="34" r="14" fill="#1E293B"/>
  <circle cx="28" cy="34" r="9" fill="#334155"/>
  <circle cx="72" cy="34" r="9" fill="#334155"/>
  <!-- Body -->
  <ellipse cx="50" cy="97" rx="24" ry="12" fill="#F8FAFC"/>
  <ellipse cx="38" cy="95" rx="9" ry="10" fill="#1E293B"/>
  <ellipse cx="62" cy="95" rx="9" ry="10" fill="#1E293B"/>
