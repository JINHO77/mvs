  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bgfw)" stroke="#DB2777" stroke-width="2"/>
  <!-- 달력 -->
  <rect x="25" y="32" width="70" height="58" rx="8" fill="#F9A8D4" stroke="#EC4899" stroke-width="1.5"/>
