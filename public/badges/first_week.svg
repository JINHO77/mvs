  <rect x="58" y="64" width="12" height="10" rx="2" fill="#EC4899" stroke="#DB2777" stroke-width="0.5"/>
  <rect x="72" y="64" width="12" height="10" rx="2" fill="#DB2777" stroke="#BE185D" stroke-width="1"/>
