<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <!-- Explorer hat brim -->
  <ellipse cx="50" cy="28" rx="28" ry="6" fill="#7C2D12"/>
  <!-- Hat top -->
  <rect x="30" y="12" width="40" height="18" rx="4" fill="#9A3412"/>
  <!-- Hat band -->
  <rect x="30" y="24" width="40" height="5" rx="2" fill="#7C2D12"/>
  <!-- Hat pin star -->
  <circle cx="62" cy="17" r="3" fill="#FCD34D"/>
  <!-- Ears -->
  <circle cx="27" cy="44" r="13" fill="#92400E"/>
  <circle cx="73" cy="44" r="13" fill="#92400E"/>
  <circle cx="27" cy="44" r="9" fill="#B45309"/>
  <circle cx="73" cy="44" r="9" fill="#B45309"/>
  <!-- Body -->
  <ellipse cx="50" cy="97" rx="24" ry="12" fill="#92400E"/>
  <ellipse cx="50" cy="99" rx="15" ry="8" fill="#B45309"/>
  <!-- Backpack strap hint -->
  <path d="M40,80 Q38,90 40,100" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M60,80 Q62,90 60,100" stroke="#4B5563" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Backpack -->
  <rect x="56" y="78" width="18" height="20" rx="4" fill="#6B7280"/>
  <rect x="60" y="82" width="10" height="3" rx="1.5" fill="#9CA3AF"/>
  <rect x="60" y="88" width="10" height="3" rx="1.5" fill="#9CA3AF"/>
  <!-- Head -->
  <circle cx="50" cy="64" r="29" fill="#92400E"/>
  <!-- Muzzle -->
  <ellipse cx="50" cy="74" rx="15" ry="12" fill="#B45309"/>
  <!-- Cheeks -->
  <circle cx="31" cy="70" r="6.5" fill="#FCA5A5" opacity="0.38"/>
  <circle cx="69" cy="70" r="6.5" fill="#FCA5A5" opacity="0.38"/>
  <!-- Eyes -->
  <circle cx="40" cy="60" r="5.5" fill="#0F172A"/>
  <circle cx="60" cy="60" r="5.5" fill="#0F172A"/>
  <circle cx="41.5" cy="58.5" r="2.2" fill="white"/>
  <circle cx="61.5" cy="58.5" r="2.2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="72" rx="5" ry="3.5" fill="#1E293B"/>
  <!-- Smile -->
  <path d="M44 77 Q50 83 56 77" stroke="#78350F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Compass -->
  <circle cx="50" cy="95" r="7" fill="#D97706"/>
  <circle cx="50" cy="95" r="5.5" fill="#FEF3C7"/>
  <line x1="50" y1="90" x2="50" y2="95" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50" y1="95" x2="50" y2="100" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
</svg>
