  <circle cx="34" cy="68" r="7" fill="#FDA4AF" opacity="0.45"/>
  <circle cx="66" cy="68" r="7" fill="#FDA4AF" opacity="0.45"/>
  <!-- Eyes -->
  <circle cx="41" cy="57" r="5.5" fill="#1C1917"/>
  <circle cx="59" cy="57" r="5.5" fill="#1C1917"/>
  <circle cx="42.5" cy="55.5" r="2.2" fill="white"/>
  <circle cx="60.5" cy="55.5" r="2.2" fill="white"/>
