  <path d="M45 70 Q50 75 55 70" stroke="#F9A8C9" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Bowtie -->
  <polygon points="40,88 48,84 48,92" fill="#FDA4AF"/>
  <polygon points="60,88 52,84 52,92" fill="#FDA4AF"/>
  <circle cx="50" cy="88" r="3" fill="#FB7185"/>
