<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <!-- Left ear -->
  <ellipse cx="33" cy="24" rx="9" ry="21" fill="#FFF0F5"/>
  <ellipse cx="33" cy="24" rx="6" ry="16" fill="#FDA4AF"/>
  <!-- Right ear -->
  <ellipse cx="67" cy="24" rx="9" ry="21" fill="#FFF0F5"/>
  <ellipse cx="67" cy="24" rx="6" ry="16" fill="#FDA4AF"/>
  <!-- Body -->
  <ellipse cx="50" cy="98" rx="22" ry="11" fill="#FFF0F5"/>
  <ellipse cx="50" cy="98" rx="14" ry="7" fill="#FDA4AF" opacity="0.3"/>
  <!-- Head -->
  <circle cx="50" cy="62" r="28" fill="#FFF0F5"/>
