<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- 큰 원 (글로우 강함) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="22" filter="url(#ringGlow)"/>

  <!-- mvs 글자 (선명, 글로우 약함) -->
  <text x="256" y="280" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" 
        font-size="105" font-weight="900" fill="#fde047" filter="url(#softGlow)" letter-spacing="-2">mvs</text>

  <!-- 미소 곡선 -->
  <path d="M 200 330 Q 256 365 312 330" stroke="url(#goldGrad)" stroke-width="13" 
        stroke-linecap="round" fill="none" filter="url(#softGlow)"/>
</svg>
